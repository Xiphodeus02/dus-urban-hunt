<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<title>Düsseldorf Quest</title>
<style>
:root{--red:#c8102e;--dark:#14161f;--card:#1f2330;--accent:#ffd23f;--ok:#2ecc71;--bad:#ff5a5f;--txt:#f4f4f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--dark);color:var(--txt);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,var(--red),#8d0b20);padding:12px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 10px #0008}
header h1{font-size:1.1rem;margin:0;flex:1}
.pts{background:var(--accent);color:#111;font-weight:800;border-radius:20px;padding:4px 12px}
.lb{background:#0004;border:0;color:#fff;border-radius:20px;padding:5px 12px;font-size:1rem}
main{padding:16px;max-width:560px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}
h2{margin:0 0 8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;background:var(--red);color:#fff;margin-top:10px;text-align:center;text-decoration:none}
.btn.alt{background:#343a4f}.btn.gold{background:var(--accent);color:#111}
.btn:disabled{opacity:.4}
input[type=text],textarea{width:100%;padding:13px;border-radius:12px;border:2px solid #343a4f;background:#12141c;color:#fff;font-size:1rem;margin-top:8px}
.bar{height:10px;background:#343a4f;border-radius:6px;overflow:hidden;margin:10px 0}
.bar div{height:100%;background:var(--ok);transition:width .4s}
.tag{display:inline-block;font-size:.75rem;background:#343a4f;border-radius:8px;padding:3px 8px;margin-right:6px}
.msg{margin-top:10px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
.hint{background:#2b2f40;border-left:4px solid var(--accent);padding:10px;border-radius:8px;margin-top:10px;font-size:.95rem}
img.prev{width:100%;border-radius:12px;margin-top:10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.list img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dot{width:26px;height:26px;border-radius:50%;background:#343a4f;display:grid;place-items:center;font-size:.75rem}
.dot.done{background:var(--ok);color:#111}.dot.cur{background:var(--accent);color:#111}
.radar{text-align:center;padding:14px;border:2px dashed var(--accent);border-radius:14px;margin-top:10px}
.radar .arrow{font-size:3rem;display:inline-block;transition:transform .3s}
.radar .dist{font-size:1.8rem;font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid #343a4f}
tr.me{background:#ffd23f22}
small{opacity:.7}
</style>
</head>
<body>
<header><h1>🦁 Düsseldorf Quest</h1><div class="pts" id="pts">0 Pkt</div><button class="lb" id="lbBtn">🏅</button></header>
<main id="app"></main>

<script>
// ===== Konfiguration =====
const TIME_LIMIT_MIN=180;
// lat/lng per OpenStreetMap/Nominatim ermittelt – bitte vor dem Einsatz vor Ort prüfen. radius in Metern.
const STATIONS=[
{id:1,place:"Alter Schlossturm / Burgplatz",lat:51.2274,lng:6.7711,radius:90,map:"Burgplatz Düsseldorf",
 story:"Start am Rhein! Hier stand einst das Düsseldorfer Schloss. Nur der Turm hat den Brand von 1872 überlebt.",
 tasks:[{type:"text",q:"Welches Museum ist heute im Schlossturm untergebracht? (Tipp: Es geht um Schiffe)",answers:["schifffahrt","schiff"],hint:"Lies das Schild am Turm: Museum der ...fahrt."},
        {type:"photo",q:"Macht ein Teamfoto mit dem Turm – alle strecken den Arm nach oben!"}]},
{id:2,place:"St. Lambertus-Kirche",lat:51.2282,lng:6.7716,radius:90,map:"Basilika St. Lambertus Düsseldorf",
 story:"Schaut genau auf die Turmspitze: Sie ist ein Wahrzeichen der Altstadt.",
 tasks:[{type:"text",q:"Der Turm ist verdreht – wie nennt man ihn? Ergänze: „Der ___ Turm“ (Legende: der Teufel hat ihn verdreht)",answers:["schiefe","schiefer"],hint:"Das Gegenteil von gerade."},
        {type:"photo",q:"Fotografiert den Turm von unten. Wer die verdrehte Spitze am besten erwischt, gewinnt die Ehre!"}]},
{id:3,place:"Marktplatz – Rathaus & Jan Wellem",lat:51.2258,lng:6.7721,radius:90,map:"Marktplatz Düsseldorf",
 story:"Vor dem Rathaus steht ein Reiter auf seinem Pferd – der beliebteste Kurfürst der Stadt.",
 tasks:[{type:"text",q:"Wie wird der Kurfürst im Volksmund genannt, der hier auf dem Pferd sitzt? (Vor- und Nachname)",answers:["jan wellem","janwellem","jan-wellem"],hint:"Steht auf dem Sockel: Jan ..."},
        {type:"photo",q:"Stellt die Reiterstatue nach: Ein Teammitglied spielt das Pferd, eins den Kurfürsten!"}]},
{id:4,place:"Heinrich-Heine-Geburtshaus",lat:51.2261,lng:6.7749,radius:80,map:"Bolkerstraße 53 Düsseldorf",
 story:"Die Bolker Straße ist die Altstadt-Hauptstraße. Hier wurde 1797 ein berühmter Dichter geboren.",
 tasks:[{type:"text",q:"Welcher berühmte Dichter wurde im Haus Nr. 53 geboren?",answers:["heine","heinrich heine"],hint:"Die Straße und das Haus tragen seinen Namen."},
        {type:"text",q:"Dichtet selbst! Schreibt einen Zweizeiler (Reim) über Düsseldorf.",free:true}]},
{id:5,place:"Königsallee („Kö“) – Tritonenbrunnen",lat:51.2262,lng:6.7790,radius:130,map:"Corneliusplatz Düsseldorf",
 story:"Edle Läden, ein Stadtgraben mit Wasser und ein berühmter Brunnen. Die Kö ist Düsseldorfs Laufsteg.",
 tasks:[{type:"text",q:"Wie heißt der große Brunnen am nördlichen Ende der Kö mit den Meeresgott-Figuren? (___-Brunnen)",answers:["triton","tritonenbrunnen","triton brunnen","tritonbrunnen"],hint:"Der Name beginnt mit „Triton“."},
        {type:"photo",q:"Modelshooting auf der Kö! Macht ein Foto in der coolsten Laufsteg-Pose."}]},
{id:6,place:"Hofgarten – Pause 🍦",lat:51.2296,lng:6.7842,radius:220,map:"Hofgarten Düsseldorf",
 story:"Ältester Park der Stadt. Zeit für eine kurze Pause und ein Eis!",
 tasks:[{type:"text",q:"Blindgang-Challenge: Ein Teammitglied läuft mit geschlossenen Augen geradeaus (die anderen passen auf!). Schreibt auf, wie viele Schritte es geschafft hat.",free:true},
        {type:"photo",q:"Foto vom schönsten Baum oder Brunnen im Park."}]},
{id:7,place:"Medienhafen – Gehry-Bauten",lat:51.2163,lng:6.7585,radius:110,map:"Neuer Zollhof Düsseldorf",
 story:"Die drei wild verbogenen Gebäude sehen aus, als würden sie tanzen! (Tipp: Bahn/Bus ab Hofgarten spart Zeit.)",
 tasks:[{type:"text",q:"Welcher berühmte US-Architekt hat die Gehry-Bauten entworfen? (Nachname reicht)",answers:["gehry","frank gehry"],hint:"Steht schon im Namen der Gebäude."},
        {type:"photo",q:"Verbiegt euch passend zu den Gebäuden – Foto mit der schrägsten Gruppenpose!"}]},
{id:8,place:"Rheinturm",lat:51.2180,lng:6.7617,radius:110,map:"Rheinturm Düsseldorf",
 story:"Der Fernsehturm ist das höchste Bauwerk der Stadt. Am Schaft läuft die größte digitale Uhr der Welt.",
 tasks:[{type:"text",q:"Wie hoch ist der Rheinturm ca.? (Zahl in Metern)",answers:["240","240,5","240.5","234","238","241"],hint:"Zwischen 230 und 250 Metern."},
        {type:"photo",q:"Foto vom Turm – Perspektiv-Trick: Alle tun so, als würden sie ihn auf der Hand halten!"}]},
{id:9,place:"Rheinuferpromenade – Ziel 🏁",lat:51.2268,lng:6.7700,radius:150,map:"Rheinuferpromenade Düsseldorf Burgplatz",
 story:"Geschafft! Der Rückweg führt entspannt am Rhein entlang bis zum Ziel.",
 tasks:[{type:"text",q:"In welches Meer fließt der Rhein am Ende?",answers:["nordsee","die nordsee"],hint:"Es liegt im Norden."},
        {type:"photo",q:"Siegerfoto! Alle zusammen mit dem Rhein im Hintergrund."}]}
];
// Punkte: Ankunft 10, Quiz 20 (−3 je Fehlversuch, min. 5), Foto 15, Kreativ 10, Tipp −5, Zeitbonus bis 60
const PTS={arrive:10,text:20,wrong:3,minText:5,photo:15,free:10,hint:5,maxBonus:60};
const KEY="dq_state_v2";
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{id:uid(),team:"",started:0,cur:0,done:{},unlocked:{},points:0,answers:{},photos:{},hints:{},wrong:{},uploaded:{},finishMin:0,bonus:0,finished:false};
let pos=null,watchId=null,gpsErr="",view="game",board=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Speicher voll – Fotos werden evtl. nicht gespeichert.")}}
const $=s=>document.querySelector(s);
const norm=t=>t.toLowerCase().replace(/[äöüß]/g,c=>({"ä":"a","ö":"o","ü":"u","ß":"ss"}[c])).replace(/[^a-z0-9., ]/g,"").trim();
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function add(p){S.points=Math.max(0,S.points+p)}

// ===== GPS =====
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos((a+c)/2*r);return Math.hypot(x,y)*R}
function bearing(a,b,c,d){const r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return(Math.atan2(y,x)/r+360)%360}
function startGps(){
  if(watchId!==null)return;
  if(!navigator.geolocation){gpsErr="Dein Browser unterstützt kein GPS.";return}
  watchId=navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};gpsErr="";checkArrival()},
    e=>{gpsErr=e.code===1?"GPS-Zugriff verweigert – bitte Standort erlauben.":"GPS-Signal nicht verfügbar.";updateRadar()},
    {enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
function checkArrival(){
  if(!S.started||S.cur>=STATIONS.length)return;
  const st=STATIONS[S.cur];
  if(!S.unlocked[st.id]&&pos){
    const d=dist(pos.lat,pos.lng,st.lat,st.lng);
    if(d<=st.radius+Math.min(pos.acc,40)*0.5)return unlock(st,true);
  }
  updateRadar();
}
function unlock(st,byGps){
  S.unlocked[st.id]=true;if(byGps)add(PTS.arrive);save();sync();
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
  if(view==="game")render();
}
function updateRadar(){
  const el=$("#radar");if(!el||S.cur>=STATIONS.length)return;
  const st=STATIONS[S.cur];
  if(!pos){el.innerHTML=`<div class="msg bad">${gpsErr||"📡 Suche GPS-Signal …"}</div>`;return}
  const d=dist(pos.lat,pos.lng,st.lat,st.lng),b=bearing(pos.lat,pos.lng,st.lat,st.lng);
  el.innerHTML=`<div class="arrow" style="transform:rotate(${b}deg)">⬆️</div><div class="dist">${d>1000?(d/1000).toFixed(1)+" km":Math.round(d)+" m"}</div>
  <small>Noch ${Math.max(0,Math.round(d-st.radius))} m bis zum Aufgabenbereich (Genauigkeit ±${Math.round(pos.acc)} m)<br>Pfeil = Richtung (Norden oben)</small>`;
}

// ===== Server-Sync (Rangliste, Antworten, Fotos) =====
let syncing=false,syncAgain=false;
function stationsDone(){return STATIONS.filter(s=>S.done[s.id]).length}
async function sync(){
  if(!S.started)return;
  if(syncing){syncAgain=true;return}
  syncing=true;
  try{
    const mins=S.finished?S.finishMin:Math.round((Date.now()-S.started)/60000);
    const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:S.id,team:S.team,points:S.points,stations:stationsDone(),finished:S.finished,minutes:mins,startedAt:S.started,answers:S.answers})});
    if(r.status===409){alert("Dieser Teamname ist schon vergeben. Bitte starte neu mit anderem Namen.");}
    else if(r.ok){board=(await r.json()).board;
      for(const [k,d] of Object.entries(S.photos)){if(S.uploaded[k])continue;
        const p=await fetch("/api/photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:S.id,team:S.team,key:k,data:d})});
        if(p.ok){S.uploaded[k]=1;save()}}}
  }catch(e){}
  syncing=false;if(syncAgain){syncAgain=false;sync()}
}
addEventListener("online",sync);setInterval(sync,30000);

// ===== Rendering =====
function render(){
  $("#pts").textContent=S.points+" Pkt";
  const app=$("#app");
  if(view==="board")return renderBoard(app);
  if(!S.started)return renderStart(app);
  if(S.cur>=STATIONS.length)return renderEnd(app);
  renderStation(app);
}
$("#lbBtn").onclick=async()=>{view=view==="board"?"game":"board";if(view==="board"){await refreshBoard()}render()};
async function refreshBoard(){try{board=await (await fetch("/api/leaderboard")).json()}catch(e){}}
function renderBoard(app){
  const rows=board.map((t,i)=>`<tr class="${t.team===S.team?"me":""}"><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${esc(t.team)} ${t.finished?"🏁":""}</td><td>${t.stations}/${STATIONS.length}</td><td>${t.minutes}′</td><td><b>${t.points}</b></td></tr>`).join("");
  app.innerHTML=`<div class="card"><h2>🏅 Rangliste</h2>${board.length?`<table><tr><th></th><th>Team</th><th>Stat.</th><th>Zeit</th><th>Pkt</th></tr>${rows}</table>`:"<p>Noch keine Teams (oder keine Verbindung).</p>"}
  <button class="btn alt" id="back">⬅ Zurück zum Spiel</button></div>`;
  $("#back").onclick=()=>{view="game";render()};
}
function renderStart(app){
  app.innerHTML=`<div class="card"><h2>Willkommen, Quest-Team! 🎒</h2>
  <p>Eure Schnitzeljagd führt euch durch <b>9 Stationen</b> in Düsseldorf (ca. 7–8 km, ca. 3 Std., Bahn erlaubt).
  Die Aufgaben einer Station <b>schalten sich per GPS frei</b>, sobald ihr vor Ort seid. Antworten und Fotos gebt ihr direkt in der App ab, eure Punkte erscheinen live in der Rangliste.</p>
  <p><small>Punkte: Ankunft +10 · Quiz bis +20 (Fehlversuche −3) · Foto +15 · Kreativ +10 · Tipp −5 · Zeitbonus bis +60. Achtet im Straßenverkehr auf euch und bleibt zusammen!</small></p>
  <input type="text" id="team" placeholder="Teamname" maxlength="30" value="${esc(S.team)}">
  <button class="btn" id="go">📍 Standort erlauben & los!</button></div>`;
  $("#go").onclick=()=>{const t=$("#team").value.trim();if(!t)return alert("Gebt euch einen Teamnamen!");
    S.team=t;S.started=Date.now();save();startGps();sync();render()};
}
function dots(){return `<div class="dots">${STATIONS.map((s,i)=>`<div class="dot ${S.done[s.id]?"done":i===S.cur?"cur":""}">${i+1}</div>`).join("")}</div>`}
const taskDone=(sid,i)=>S.done[sid+"-"+i];
function renderStation(app){
  const st=STATIONS[S.cur],open=S.unlocked[st.id];
  const all=st.tasks.every((_,i)=>taskDone(st.id,i));
  let body;
  if(!open){
    body=`<div class="card"><b>🔒 Aufgaben gesperrt</b><p>Geht zum Ort – sobald ihr im markierten Bereich seid, öffnen sich die Aufgaben automatisch.</p>
    <div class="radar" id="radar"></div>
    <details style="margin-top:12px"><summary>GPS klappt nicht?</summary><p><small>Frag die Spielleitung nach dem Freischalt-Code (ohne Ankunftspunkte).</small></p>
    <input type="text" id="code" placeholder="Code"><button class="btn alt" id="codeBtn">Freischalten</button><div class="msg bad" id="codeMsg"></div></details></div>`;
  }else{
    body=st.tasks.map((t,i)=>taskHtml(st,t,i)).join("")+
    `<button class="btn gold" id="next" ${all?"":"disabled"}>${S.cur===STATIONS.length-1?"Quest abschließen 🏁":"Weiter zur nächsten Station ➜"}</button>`;
  }
  app.innerHTML=`${dots()}<div class="bar"><div style="width:${S.cur/STATIONS.length*100}%"></div></div>
  <div class="card"><span class="tag">Station ${S.cur+1}/${STATIONS.length}</span><h2>${st.place}</h2>${open?`<p>${st.story}</p>`:`<p><small>Die Geschichte zur Station erfahrt ihr vor Ort.</small></p>`}
  <a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lng}&travelmode=walking">📍 Route in Google Maps</a></div>${body}
  <button class="btn alt" id="skip">Station überspringen (0 Punkte)</button>`;
  if(!open){updateRadar();startGps();
    $("#codeBtn").onclick=async()=>{
      try{const r=await fetch("/api/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("#code").value})});
        if(r.ok)unlock(st,false);else $("#codeMsg").textContent="Falscher Code."}
      catch(e){$("#codeMsg").textContent="Keine Verbindung zum Server."}}}
  else st.tasks.forEach((t,i)=>bind(st,t,i));
  if($("#next"))$("#next").onclick=()=>advance(st);
  $("#skip").onclick=()=>{if(confirm("Wirklich überspringen? Dafür gibt es keine weiteren Punkte.")){S.unlocked[st.id]=true;advance(st,true)}};
}
function advance(st,skipped){
  if(!skipped)S.done[st.id]=true;
  S.cur++;
  if(S.cur>=STATIONS.length&&!S.finished){
    S.finished=true;S.finishMin=Math.round((Date.now()-S.started)/60000);
    S.bonus=Math.max(0,Math.min(PTS.maxBonus,TIME_LIMIT_MIN-S.finishMin));add(S.bonus);
  }
  save();sync();render();scrollTo(0,0);
}
function taskHtml(st,t,i){
  const k=st.id+"-"+i,done=taskDone(st.id,i);
  let h=`<div class="card"><b>${t.type==="photo"?"📸 Foto-Aufgabe":t.free?"✍️ Kreativ-Aufgabe":"❓ Quizfrage"}</b><p>${t.q}</p>`;
  if(done){
    h+=t.type==="photo"?`<img class="prev" src="${S.photos[k]}">`:`<div class="msg ok">✅ ${esc(S.answers[k]||"")}</div>`;
  }else if(t.type==="photo"){
    h+=`<input type="file" accept="image/*" capture="environment" id="f${k}" hidden><button class="btn" id="b${k}">📷 Foto aufnehmen / hochladen</button>`;
  }else{
    h+=t.free?`<textarea id="a${k}" rows="3" placeholder="Eure Antwort…"></textarea>`:`<input type="text" id="a${k}" placeholder="Antwort" autocomplete="off">`;
    h+=`<button class="btn" id="b${k}">Absenden</button>`;
    if(t.hint)h+=`<button class="btn alt" id="h${k}">💡 Tipp (−${PTS.hint} Pkt)</button>`;
    if(S.hints[k])h+=`<div class="hint">${t.hint}</div>`;
    h+=`<div class="msg" id="m${k}"></div>`;
  }
  return h+"</div>";
}
function bind(st,t,i){
  const k=st.id+"-"+i;if(taskDone(st.id,i))return;
  if(t.type==="photo"){
    $("#b"+k).onclick=()=>$("#f"+k).click();
    $("#f"+k).onchange=async e=>{const f=e.target.files[0];if(!f)return;
      S.photos[k]=await shrink(f);S.done[k]=true;add(PTS.photo);save();sync();render()};
  }else{
    const h=$("#h"+k);
    if(h)h.onclick=()=>{if(!S.hints[k]){S.hints[k]=1;add(-PTS.hint);save();sync();render()}};
    $("#b"+k).onclick=()=>{
      const v=$("#a"+k).value.trim(),m=$("#m"+k);
      if(!v){m.className="msg bad";m.textContent="Bitte etwas eingeben.";return}
      if(t.free){S.answers[k]=v;S.done[k]=true;add(PTS.free);save();sync();return render()}
      const n=norm(v);
      if(t.answers.some(a=>n===norm(a)||(norm(a).length>3&&n.includes(norm(a))))){
        S.answers[k]=v;S.done[k]=true;
        add(Math.max(PTS.minText,PTS.text-PTS.wrong*(S.wrong[k]||0)));save();sync();render();
      }else{S.wrong[k]=(S.wrong[k]||0)+1;save();m.className="msg bad";m.textContent="Leider falsch – versucht es nochmal! (−"+PTS.wrong+" Pkt möglich)"}
    };
  }
}
function shrink(file){return new Promise(res=>{const img=new Image(),r=new FileReader();
  r.onload=()=>{img.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};img.src=r.result};r.readAsDataURL(file)})}
function renderEnd(app){
  const m=S.finishMin,pics=Object.values(S.photos);
  app.innerHTML=`<div class="card"><h2>🏆 Geschafft, ${esc(S.team)}!</h2>
  <p><b>${S.points}</b> Punkte in <b>${Math.floor(m/60)} Std ${m%60} Min</b> (Zeitbonus: +${S.bonus}).</p>
  <div class="list">${pics.map(d=>`<img src="${d}">`).join("")}</div>
  <button class="btn gold" id="lb2">🏅 Rangliste ansehen</button>
  <button class="btn alt" id="share">📤 Ergebnis teilen</button>
  <button class="btn alt" id="reset">🔄 Neu starten</button></div>`;
  $("#lb2").onclick=async()=>{view="board";await refreshBoard();render()};
  $("#share").onclick=async()=>{const text=`Team ${S.team}: ${S.points} Punkte bei der Düsseldorf Quest!`;try{await navigator.share({text})}catch(e){}};
  $("#reset").onclick=()=>{if(confirm("Alles löschen?")){localStorage.removeItem(KEY);location.reload()}};
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(S.started&&!S.finished)startGps();
render();sync();
setInterval(()=>{if(view==="board")refreshBoard().then(render)},20000);
</script>

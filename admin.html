<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spielleitung – Düsseldorf Quest</title>
<style>body{font-family:system-ui;background:#14161f;color:#eee;margin:0;padding:16px}
.t{background:#1f2330;border-radius:12px;padding:14px;margin-bottom:12px}img{width:110px;height:110px;object-fit:cover;border-radius:8px;margin:4px}
h3{margin:0 0 6px}small{opacity:.7}input{padding:8px;border-radius:8px;border:0}button{padding:8px 14px;border:0;border-radius:8px;background:#c8102e;color:#fff}</style></head>
<body><h2>🧭 Spielleitung</h2>
<input id="pin" placeholder="PIN" type="password"> <button onclick="load()">Laden</button>
<div id="o"></div>
<script>
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
  const r=await fetch("/api/admin?pin="+encodeURIComponent(document.getElementById("pin").value));
  if(!r.ok)return alert("Falsche PIN");
  const d=(await r.json()).sort((a,b)=>b.points-a.points);
  document.getElementById("o").innerHTML=d.map((t,i)=>`<div class="t"><h3>${i+1}. ${esc(t.team)} – ${t.points} Pkt ${t.finished?"🏁":""}</h3>
  <small>${t.stations} Stationen · ${t.minutes} Min</small>
  <div>${Object.entries(t.answers).map(([k,v])=>`<div><small>${esc(k)}</small>: ${esc(v)}</div>`).join("")}</div>
  <div>${Object.entries(t.photos).map(([k,f])=>`<a href="/uploads/${f}" target="_blank"><img src="/uploads/${f}" title="${esc(k)}"></a>`).join("")}</div></div>`).join("");
}
</script></body></html>
